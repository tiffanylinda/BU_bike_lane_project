# Camera and analysis settings for the Comm Ave bike lane monitor.
# Pixel values are PLACEHOLDERS. Replace them using:
#   python tools/pick_points.py --video data/raw_video/<clip>.mp4
# If the camera moves, re-pick the line and polygon.

location:
  name: "Comm Ave bike lane, Essex St to Kenmore Sq"   # replace with exact spot
  lat: 42.3500        # replace with the camera's real position
  lon: -71.1000
  timezone: America/New_York

model:
  weights: yolov8s.pt          # "s" finds small far-side vehicles much better than "n"; sampling makes up the speed
  conf: 0.25                   # far vehicles score low; LaneMonitor's 10 s rule filters one-off false hits
  classes: [0, 1, 2, 3, 5, 7, 36]   # person, bicycle, car, motorcycle, bus, truck, skateboard
  imgsz: 1280                  # YOLO input size for the crop below (multiple of 32)

detection:                     # speed + far-side accuracy (see detection_roi in src/detect.py)
  sample_fps: 5                # analyse 5 frames per second instead of all 30-60
  roi_pad:                     # crop = lane polygon's bounding box plus this padding (pixels)
    above: 90                  # vehicle boxes stick up above the lane, so pad most here
    below: 30
    side: 40

counting_line:                 # straight up and down across the lane, tall enough to catch riders
  points: [[1371, 340], [1371, 425]]
  side_a_name: "toward Kenmore"
  side_b_name: "toward Essex"

lane_polygon:                  # right end, then along the lower edge, back along the upper edge
  - [1624, 423]
  - [1624, 435]
  - [333, 327]
  - [341, 309]

blockage:
  vehicle_classes: [car, truck, bus]
  stopped_max_speed_px_s: 15   # slower than this counts as stopped (not just passing)
  possible_after_s: 10         # stopped this long -> status "possible"
  blocked_after_s: 30          # stopped this long -> status "blocked" (an alert)
  clear_after_s: 5             # lane empty this long -> status "clear" (avoids flicker)
  speed_window_s: 2            # speed is averaged over this many seconds
  merge_gap_s: 15              # keep a hidden stopped vehicle this long (Green Line / bus passing in front)
  merge_distance_px: 40        # a box within this many px of a followed vehicle is the same vehicle
  lane_tolerance_px: 8         # far lane is ~10 px tall: accept wheels this close to the polygon

scooter:
  min_speed_px_s: 120          # person faster than this, with no bicycle -> possible scooter

validation:
  min_telraam_uptime: 0.5      # ignore Telraam hours with less camera activity than this

demo:
  playback_speed: 1.0          # 1.0 = real time
  alert_sound: true
